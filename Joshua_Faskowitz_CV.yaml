    Research Profile:
      - "I study how large-scale brain organization emerges from interactions among brain areas, with an emphasis on edge-centric models, mesoscale structure, and the interpretation of functional MRI signals. My work combines network science, computational modeling, and neuroimaging analysis to develop methods for understanding brain structure, function, and dynamics."

