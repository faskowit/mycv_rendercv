design:
  theme: "sb2nov"

  templates:
    footer: "#align(right)[NAME, PAGE_NUMBER/TOTAL_PAGES]"
    top_note: "*LAST_UPDATED MONTH_NAME YEAR*"    
    single_date: YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS

    publication_entry:
      main_column: "**TITLE**\nSUMMARY\nAUTHORS\nJOURNAL."
      date_and_location_column: DATE

    # publication_entry:
    #     main_column: |-
    #       **TITLE** 
    #       #block(inset: (left: 0.5em))AUTHORS
    #       JOURNAL

  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: true
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0cm
      space_left: 0.5em
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.5em
    space_between_text_based_entries: 0.2em
    show_time_spans_in: 
      - experience
  links:
    underline: false
    show_external_link_icon: false

locale:
  language: "english"

settings:
  current_date: "2026-06-25"
  render_command:
    output_folder: rendercv_output
    typst_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.typ
    pdf_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.pdf
    markdown_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.md
    html_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.html
    png_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.png
    dont_generate_markdown: false
    dont_generate_html: false
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: true
